<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Geography Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f4f0;min-height:100vh;padding:12px;display:flex;flex-direction:column;align-items:center}
#app{width:100%;max-width:480px;position:relative}
.screen{display:none}.screen.active{display:block}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
h1{font-size:20px;font-weight:500;color:#1a1a1a;margin-bottom:2px}
.sub{font-size:13px;color:#666;margin-bottom:12px}
.btn{display:flex;align-items:center;width:100%;padding:10px 14px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;margin-bottom:8px;transition:background 0.12s;font-family:inherit;gap:8px}
.btn:hover{background:#f5f4f0}
.btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#0F6E56}
.btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#A32D2D}
.btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#0F6E56;opacity:0.7}
.btn-primary{background:#378ADD;border-color:#185FA5;color:#fff;font-weight:500;justify-content:center;padding:10px 16px}
.btn-primary:hover{background:#185FA5}
.btn-secondary{justify-content:center}
.diff-btn{flex:1;padding:8px 6px;font-size:12px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#fff;color:#666;cursor:pointer;text-align:center;font-family:inherit}
.diff-btn.active{background:#E6F1FB;color:#0C447C;border-color:#378ADD;font-weight:500}
.progress-bar{height:4px;background:rgba(0,0,0,0.08);border-radius:2px;margin-bottom:12px;overflow:hidden}
.progress-fill{height:100%;background:#378ADD;border-radius:2px;transition:width 0.3s}
.hud{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.hud-stat{background:#f5f4f0;border-radius:8px;padding:4px 10px;font-size:12px;color:#666}
.hud-stat b{color:#1a1a1a;font-weight:500}
.step-dots{display:flex;gap:5px;margin-bottom:10px}
.step-dot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,0.12)}
.step-dot.done{background:#1D9E75}.step-dot.active{background:#378ADD}
.flag-box{font-size:72px;text-align:center;padding:14px 0;line-height:1}
.feedback{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;line-height:1.5}
.feedback.good{background:#E1F5EE;color:#0F6E56}
.feedback.bad{background:#FCEBEB;color:#A32D2D}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-easy{background:#E1F5EE;color:#0F6E56}
.badge-medium{background:#FAEEDA;color:#854F0B}
.badge-hard{background:#FCEBEB;color:#A32D2D}
.award-banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;text-align:center}
.award-banner.gold{background:#FAEEDA;border:1px solid #EF9F27}
.award-banner.silver{background:#F1EFE8;border:1px solid #888780}
.award-banner.bronze{background:#FAECE7;border:1px solid #D85A30}
.award-banner.none{background:#f5f4f0;border:0.5px solid rgba(0,0,0,0.1)}
.stars-row{display:flex;gap:4px;justify-content:center;margin:8px 0 12px}
.star{font-size:28px;opacity:0.2;transition:opacity 0.3s,transform 0.3s}
.star.earned{opacity:1;transform:scale(1.15)}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat-box{background:#f5f4f0;border-radius:8px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:500;color:#1a1a1a}
.stat-lbl{font-size:11px;color:#666;margin-top:1px}
.bottom-nav{display:flex;border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;overflow:hidden;margin-bottom:14px;background:#fff}
.nav-btn{flex:1;padding:9px 6px;font-size:11px;border:none;background:transparent;color:#666;cursor:pointer;font-family:inherit}
.nav-btn.active{background:#E6F1FB;color:#0C447C;font-weight:500}
.ach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.ach-card{background:#f5f4f0;border-radius:10px;padding:10px 12px;opacity:0.4}
.ach-card.unlocked{opacity:1;background:#fff;border:0.5px solid rgba(0,0,0,0.1)}
.ach-icon{font-size:20px;margin-bottom:4px}
.ach-name{font-size:12px;font-weight:500;color:#1a1a1a;margin-bottom:2px}
.ach-desc{font-size:11px;color:#666;line-height:1.3}
.profile-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:48px;height:48px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #378ADD}
.level-bar{height:6px;background:rgba(0,0,0,0.08);border-radius:3px;overflow:hidden;margin-top:4px}
.level-fill{height:100%;background:#378ADD;border-radius:3px;transition:width 0.4s}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:100}
#toast.show{opacity:1}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none}
.map-svg{width:100%;height:auto;display:block;border-radius:10px;border:0.5px solid rgba(0,0,0,0.1);margin-bottom:10px}
.cp{fill:#C0DD97;stroke:#fff;stroke-width:1.2;cursor:pointer;transition:fill 0.15s}
.cp:hover{fill:#97C459}
.cp.dimmed{fill:#D3D1C7;stroke:#fff;cursor:default;pointer-events:none}
.cp.active-target{fill:#C0DD97;stroke:#378ADD;stroke-width:2}
.cp.correct-flash{fill:#1D9E75;cursor:default;pointer-events:none}
.cp.wrong-flash{fill:#E24B4A;cursor:default;pointer-events:none}
.cp.reveal-flash{fill:#1D9E75;opacity:0.8;cursor:default;pointer-events:none}
.map-hint{font-size:12px;color:#888;text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
<div id="toast"></div>

<div id="s-home" class="screen active">
  <div style="padding:4px 0 10px;display:flex;align-items:center;justify-content:space-between">
    <div><h1>World Quiz</h1><p class="sub" style="margin:0">Flag → capital → find on map</p></div>
    <div id="home-streak" style="display:none;background:#FAEEDA;color:#854F0B;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500">🔥 <span id="streak-num">0</span></div>
  </div>
  <div class="card" style="padding:10px 12px;margin-bottom:10px">
    <div class="profile-header">
      <div class="avatar" id="home-avatar">🌍</div>
      <div style="flex:1">
        <div style="font-size:12px;color:#666">Level <b id="home-level">1</b> <span id="home-title">Explorer</span></div>
        <div style="font-size:11px;color:#888;margin-bottom:3px" id="home-xp-label">0 / 100 XP</div>
        <div class="level-bar"><div class="level-fill" id="home-level-fill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" id="home-total-score">0</div><div class="stat-lbl">Total score</div></div>
      <div class="stat-box"><div class="stat-val" id="home-games">0</div><div class="stat-lbl">Games played</div></div>
      <div class="stat-box"><div class="stat-val" id="home-best-streak">0</div><div class="stat-lbl">Best streak</div></div>
      <div class="stat-box"><div class="stat-val" id="home-accuracy">-</div><div class="stat-lbl">Accuracy</div></div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="showHomeTab('play')">🎮 Play</button>
    <button class="nav-btn" onclick="showHomeTab('achievements')">🏆 Awards</button>
    <button class="nav-btn" onclick="showHomeTab('leaderboard')">📋 Scores</button>
  </div>
  <div id="tab-play">
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button class="diff-btn active" id="d-easy" onclick="setDiff('easy')">Easy</button>
      <button class="diff-btn" id="d-medium" onclick="setDiff('medium')">Medium</button>
      <button class="diff-btn" id="d-hard" onclick="setDiff('hard')">Hard</button>
    </div>
    <p style="font-size:11px;color:#888;margin-bottom:12px">Easy: 4 choices · Medium: 6 choices · Hard: type the answer</p>
    <button class="btn" onclick="startQuiz('Europe')">🌍 Europe <span style="font-size:11px;color:#888;margin-left:auto">25 countries</span></button>
    <button class="btn" onclick="startQuiz('Africa')">🌍 Africa <span style="font-size:11px;color:#888;margin-left:auto">20 countries</span></button>
    <button class="btn" onclick="startQuiz('Asia')">🌏 Asia <span style="font-size:11px;color:#888;margin-left:auto">20 countries</span></button>
    <button class="btn" onclick="startQuiz('North America')">🌎 N. America <span style="font-size:11px;color:#888;margin-left:auto">12 countries</span></button>
    <button class="btn" onclick="startQuiz('South America')">🌎 S. America <span style="font-size:11px;color:#888;margin-left:auto">12 countries</span></button>
    <button class="btn" onclick="startQuiz('All')">🌐 All continents <span style="font-size:11px;color:#888;margin-left:auto">shuffle</span></button>
  </div>
  <div id="tab-achievements" style="display:none"><div class="ach-grid" id="ach-grid"></div></div>
  <div id="tab-leaderboard" style="display:none">
    <div id="lb-rows"></div>
    <div id="lb-empty" style="font-size:13px;color:#888;text-align:center;padding:20px 0">No games yet!</div>
  </div>
</div>

<div id="s-quiz" class="screen">
  <div class="hud">
    <div class="hud-stat">Q <b id="q-num">1</b>/<b id="q-total">10</b></div>
    <div class="hud-stat">Score <b id="q-score">0</b></div>
    <div class="hud-stat" id="q-streak-hud" style="display:none">🔥 <b id="q-streak-val">0</b></div>
    <div class="hud-stat" id="q-cont-disp">Europe</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="q-progress" style="width:0%"></div></div>
  <div class="step-dots" id="step-dots"></div>
  <div id="q-body"></div>
  <button class="btn btn-primary" id="next-btn" style="display:none" onclick="nextStep()">Continue →</button>
</div>

<div id="s-result" class="screen">
  <div id="result-award-banner" class="award-banner none"></div>
  <div class="stars-row" id="result-stars"></div>
  <div class="card">
    <div style="font-size:15px;font-weight:500;margin-bottom:4px">Round complete!</div>
    <p class="sub" id="res-sub"></p>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" id="res-score"></div><div class="stat-lbl">Score</div></div>
      <div class="stat-box"><div class="stat-val" id="res-acc"></div><div class="stat-lbl">Accuracy</div></div>
      <div class="stat-box"><div class="stat-val" id="res-streak"></div><div class="stat-lbl">Best streak</div></div>
      <div class="stat-box"><div class="stat-val" id="res-xp"></div><div class="stat-lbl">XP earned</div></div>
    </div>
    <div id="new-achievements" style="margin-bottom:10px"></div>
    <div id="res-breakdown" style="margin-bottom:12px"></div>
    <button class="btn btn-primary" onclick="startQuiz(G.continent)" style="margin-bottom:8px">Play again</button>
    <button class="btn btn-secondary" onclick="showHome()">Choose continent</button>
  </div>
</div>
</div>

const ACHIEVEMENTS=[
  {id:"first_game",icon:"🎮",name:"First steps",desc:"Complete your first round",check:p=>p.gamesPlayed>=1},
  {id:"perfect_round",icon:"💯",name:"Perfect round",desc:"100% accuracy in a round",check:p=>p.perfectRounds>=1},
  {id:"streak5",icon:"🔥",name:"On fire",desc:"Get a 5-answer streak",check:p=>p.bestStreak>=5},
  {id:"streak10",icon:"🌋",name:"Unstoppable",desc:"10-answer streak",check:p=>p.bestStreak>=10},
  {id:"hard_win",icon:"💎",name:"Diamond mind",desc:"Score 80%+ on Hard",check:p=>p.hardHighScore>=80},
  {id:"globe_trotter",icon:"🌐",name:"Globe trotter",desc:"Play all 5 continent sets",check:p=>(p.continentsPlayed||[]).length>=5},
  {id:"century",icon:"✨",name:"Century",desc:"Earn 1000 total XP",check:p=>p.totalXP>=1000},
  {id:"europe_master",icon:"🏰",name:"Europe expert",desc:"Score 90%+ on Europe",check:p=>(p.continentBest||{})['Europe']>=90},
  {id:"africa_master",icon:"🌍",name:"Africa expert",desc:"Score 90%+ on Africa",check:p=>(p.continentBest||{})['Africa']>=90},
  {id:"asia_master",icon:"🐉",name:"Asia expert",desc:"Score 90%+ on Asia",check:p=>(p.continentBest||{})['Asia']>=90},
  {id:"games10",icon:"🎯",name:"Dedicated",desc:"Play 10 rounds",check:p=>p.gamesPlayed>=10},
  {id:"americas",icon:"🦅",name:"Americas expert",desc:"90%+ on N or S America",check:p=>(p.continentBest||{})['North America']>=90||(p.continentBest||{})['South America']>=90},
];

const LEVELS=[
  {level:1,title:"Explorer",avatar:"🌍",xpNeeded:100},
  {level:2,title:"Traveller",avatar:"✈️",xpNeeded:250},
  {level:3,title:"Navigator",avatar:"🧭",xpNeeded:500},
  {level:4,title:"Geographer",avatar:"🗺️",xpNeeded:900},
  {level:5,title:"Cartographer",avatar:"📍",xpNeeded:1400},
  {level:6,title:"World Scholar",avatar:"🎓",xpNeeded:2000},
  {level:7,title:"Continent Master",avatar:"🏆",xpNeeded:3000},
  {level:8,title:"Geography Legend",avatar:"⭐",xpNeeded:999999},
];

let profile={gamesPlayed:0,totalScore:0,totalXP:0,totalCorrect:0,totalAnswers:0,bestStreak:0,perfectRounds:0,hardHighScore:0,continentsPlayed:[],continentBest:{},unlockedAchievements:[],leaderboard:[]};
try{const s=localStorage.getItem('geoQuizV3');if(s)profile=Object.assign(profile,JSON.parse(s));}catch(e){}
function saveProfile(){try{localStorage.setItem('geoQuizV3',JSON.stringify(profile));}catch(e){}}

let G={diff:'easy',continent:'',queue:[],idx:0,step:0,score:0,correct:0,total:0,streak:0,maxStreak:0};

function getLevelInfo(xp){
  for(let i=LEVELS.length-1;i>=0;i--){
    const prev=i===0?0:LEVELS[i-1].xpNeeded;
    if(i===0||xp>=prev) return{...LEVELS[i],prevXP:prev,nextXP:LEVELS[i].xpNeeded,progress:Math.min((xp-prev)/(LEVELS[i].xpNeeded-prev),1)};
  }
  return{...LEVELS[0],prevXP:0,nextXP:100,progress:xp/100};
}

function updateHomeUI(){
  const li=getLevelInfo(profile.totalXP);
  document.getElementById('home-level').textContent=li.level;
  document.getElementById('home-title').textContent=li.title;
  document.getElementById('home-xp-label').textContent=Math.round(profile.totalXP)+' / '+li.nextXP+' XP';
  document.getElementById('home-level-fill').style.width=Math.round(li.progress*100)+'%';
  document.getElementById('home-avatar').textContent=li.avatar;
  document.getElementById('home-total-score').textContent=profile.totalScore.toLocaleString();
  document.getElementById('home-games').textContent=profile.gamesPlayed;
  document.getElementById('home-best-streak').textContent=profile.bestStreak;
  document.getElementById('home-accuracy').textContent=profile.totalAnswers>0?Math.round(profile.totalCorrect/profile.totalAnswers*100)+'%':'-';
  renderAchievements();renderLeaderboard();
}

function showHomeTab(tab){
  ['play','achievements','leaderboard'].forEach(t=>document.getElementById('tab-'+t).style.display=t===tab?'block':'none');
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['play','achievements','leaderboard'][i]===tab));
}

function renderAchievements(){
  document.getElementById('ach-grid').innerHTML=ACHIEVEMENTS.map(a=>`
    <div class="ach-card ${profile.unlockedAchievements.includes(a.id)?'unlocked':''}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
    </div>`).join('');
}

function renderLeaderboard(){
  const lb=profile.leaderboard||[];
  document.getElementById('lb-empty').style.display=lb.length?'none':'block';
  document.getElementById('lb-rows').innerHTML=lb.map((e,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,0.07);font-size:13px">
      <span style="width:22px;color:#888;font-size:12px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'}</span>
      <span style="flex:1">${e.continent}</span>
      <span class="badge badge-${e.diff}">${e.diff}</span>
      <span style="font-size:11px;color:#888;margin:0 4px">${e.acc}%</span>
      <span style="font-weight:500">${e.score}</span>
    </div>`).join('');
}

function checkAchievements(){
  const n=[];
  ACHIEVEMENTS.forEach(a=>{if(!profile.unlockedAchievements.includes(a.id)&&a.check(profile)){profile.unlockedAchievements.push(a.id);n.push(a);}});
  return n;
}

function setDiff(d){G.diff=d;['easy','medium','hard'].forEach(x=>document.getElementById('d-'+x).classList.toggle('active',x===d));}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showHome(){updateHomeUI();showScreen('s-home');}
function shuffle(arr){return arr.slice().sort(()=>Math.random()-0.5);}

function startQuiz(continent){
  G.continent=continent;
  let pool=continent==='All'?Object.values(COUNTRIES).flat():COUNTRIES[continent]||[];
  G.queue=shuffle(pool).slice(0,10);
  G.idx=0;G.step=0;G.score=0;G.correct=0;G.total=0;G.streak=0;G.maxStreak=0;
  document.getElementById('q-cont-disp').textContent=continent;
  document.getElementById('q-total').textContent=G.queue.length;
  document.getElementById('q-score').textContent='0';
  document.getElementById('q-streak-hud').style.display='none';
  showScreen('s-quiz');
  renderQuestion();
}

function renderQuestion(){
  document.getElementById('q-num').textContent=G.idx+1;
  document.getElementById('q-progress').style.width=Math.round((G.idx/G.queue.length)*100)+'%';
  G.step=0;renderStep();
}

function renderStep(){
  const q=G.queue[G.idx];
  document.getElementById('step-dots').innerHTML=[0,1,2].map(i=>
    `<div class="step-dot ${i<G.step?'done':i===G.step?'active':''}"></div>`).join('');
  document.getElementById('next-btn').style.display='none';
  const body=document.getElementById('q-body');
  if(G.step===0)renderFlagStep(q,body);
  else if(G.step===1)renderCapitalStep(q,body);
  else renderMapStep(q,body);
}

function getPool(){return G.continent==='All'?Object.values(COUNTRIES).flat():(COUNTRIES[G.continent]||[]);}
function getOptions(field,correct,n){
  return shuffle([correct,...shuffle(getPool().filter(c=>c[field]!==correct)).slice(0,n-1).map(c=>c[field])]);
}

function renderFlagStep(q,body){
  body.innerHTML=`<div class="card" style="text-align:center">
    <p style="font-size:12px;color:#888;margin-bottom:4px">Step 1 — What country is this flag?</p>
    <div class="flag-box">${q.flag}</div></div><div id="ans-area"></div>`;
  renderAnswerArea('name',q);
}

function renderCapitalStep(q,body){
  body.innerHTML=`<div class="card" style="text-align:center">
    <p style="font-size:12px;color:#888;margin-bottom:4px">Step 2 — Capital of ${q.name}?</p>
    <div style="font-size:38px;margin:6px 0">${q.flag}</div>
    <p style="font-size:15px;font-weight:500">${q.name}</p></div><div id="ans-area"></div>`;
  renderAnswerArea('capital',q);
}

function renderAnswerArea(field,q){
  const cont=document.getElementById('ans-area');
  if(G.diff==='hard'){
    cont.innerHTML=`<input type="text" id="hi" placeholder="Type your answer..." style="width:100%;margin-bottom:8px">
      <button class="btn btn-primary" onclick="checkHard('${field}','${(field==='name'?q.name:q.capital).replace(/'/g,"\\'")}')">Check</button>`;
    setTimeout(()=>{const e=document.getElementById('hi');if(e)e.focus();},50);return;
  }
  const n=G.diff==='medium'?6:4;
  cont.innerHTML=getOptions(field,q[field],n).map(o=>
    `<button class="btn" onclick="checkChoice(this,'${o.replace(/'/g,"\\'")}','${q[field].replace(/'/g,"\\'")}','${field}')">${o}</button>`).join('');
}

function renderMapStep(q,body){
  const continent=G.continent==='All'?'All':G.continent;
  const mapSVG=continent==='All'?MAPS['Europe']:MAPS[continent];
  const quizISOs=new Set(G.queue.map(c=>c.iso));

  body.innerHTML=`<div class="card" style="padding:10px 12px">
    <p style="font-size:12px;color:#888;margin-bottom:2px">Step 3 — Click on <b style="color:#1a1a1a">${q.name}</b></p>
    <p style="font-size:12px;color:#666">${q.flag} Capital: ${q.capital}</p>
  </div>
  <div id="map-holder">${mapSVG||''}</div>
  <div id="map-feedback" style="font-size:13px;color:#666;min-height:22px;padding:4px 0 8px"></div>`;

  if(!mapSVG){
    document.getElementById('map-holder').innerHTML=`<div style="padding:20px;text-align:center;font-size:13px;color:#888;background:#f5f4f0;border-radius:10px;margin-bottom:10px">Map not available for "All continents" mix — <button class="btn btn-primary" style="width:auto;display:inline-flex;margin-top:8px" onclick="skipMapStep()">Skip step</button></div>`;
    return;
  }

  const svg=document.querySelector('#map-holder .map-svg');
  if(!svg)return;
  svg.querySelectorAll('.cp').forEach(p=>{
    const iso=p.id.replace('c-','');
    if(!quizISOs.has(iso)){p.classList.add('dimmed');}
    else{
      p.addEventListener('click',()=>handleMapClick(iso,q.iso,p,svg));
    }
  });
}

function skipMapStep(){handleAnswer(false,'map','(skipped)');}

function handleMapClick(clickedISO,targetISO,clickedPath,svg){
  if(svg.dataset.answered)return;
  svg.dataset.answered='1';
  svg.querySelectorAll('.cp:not(.dimmed)').forEach(p=>{p.style.pointerEvents='none';});
  const ok=clickedISO===targetISO;
  clickedPath.classList.add(ok?'correct-flash':'wrong-flash');
  if(!ok){
    const correct=svg.querySelector('#c-'+targetISO);
    if(correct){correct.classList.remove('dimmed');correct.classList.add('reveal-flash');}
  }
  const fb=document.getElementById('map-feedback');
  if(fb)fb.innerHTML=ok
    ?`<span style="color:#0F6E56">✓ Correct! That's ${G.queue[G.idx].name}.</span>`
    :`<span style="color:#A32D2D">✗ Wrong — the green country is ${G.queue[G.idx].name}.</span>`;
  handleAnswer(ok,'map',G.queue[G.idx].name);
}

function checkChoice(btn,chosen,correct,field){
  btn.parentNode.querySelectorAll('button').forEach(b=>b.disabled=true);
  const ok=chosen===correct;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)btn.parentNode.querySelectorAll('button').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('reveal');});
  handleAnswer(ok,field,correct);
}
function checkHard(field,correct){
  const input=document.getElementById('hi');if(!input)return;
  const ok=input.value.trim().toLowerCase()===correct.toLowerCase();
  input.disabled=true;input.style.background=ok?'#E1F5EE':'#FCEBEB';input.style.color=ok?'#0F6E56':'#A32D2D';
  handleAnswer(ok,field,correct);
}

function handleAnswer(ok,field,correct){
  G.total++;
  if(ok){G.correct++;G.streak++;if(G.streak>G.maxStreak)G.maxStreak=G.streak;}else G.streak=0;
  if(G.streak===5)showToast('🔥 5 in a row!');
  if(G.streak===10)showToast('🌋 10 streak! Unstoppable!');
  const hud=document.getElementById('q-streak-hud');
  if(G.streak>=2){hud.style.display='';document.getElementById('q-streak-val').textContent=G.streak;}else hud.style.display='none';
  const base=G.diff==='easy'?10:G.diff==='medium'?15:20;
  const bonus=ok?Math.min(G.streak-1,4)*2:0;
  G.score+=ok?base+bonus:0;
  document.getElementById('q-score').textContent=G.score;
  if(field!=='map'){
    const fb=document.createElement('div');
    fb.className='feedback '+(ok?'good':'bad');
    const sm=ok&&G.streak>=3?` (${G.streak}x streak +${bonus})`:'';
    fb.innerHTML=ok?`✓ Correct!${sm}`:`✗ Answer: <b>${correct}</b>`;
    const body=document.getElementById('q-body');
    const ex=body.querySelector('.feedback');if(ex)ex.remove();
    body.appendChild(fb);
  }
  document.getElementById('next-btn').style.display='block';
}

function nextStep(){
  G.step++;
  if(G.step>2){G.idx++;if(G.idx>=G.queue.length){endRound();return;}renderQuestion();}
  else renderStep();
}

function calcStars(acc,diff){
  if(diff==='easy')return acc>=90?3:acc>=70?2:acc>=50?1:0;
  if(diff==='medium')return acc>=85?3:acc>=65?2:acc>=45?1:0;
  return acc>=80?3:acc>=60?2:acc>=40?1:0;
}

function endRound(){
  const acc=G.total>0?Math.round(G.correct/G.total*100):0;
  const stars=calcStars(acc,G.diff);
  const xpEarned=Math.round(G.score*0.5*(G.diff==='easy'?1:G.diff==='medium'?1.5:2));
  profile.gamesPlayed++;profile.totalScore+=G.score;profile.totalXP+=xpEarned;
  profile.totalCorrect+=G.correct;profile.totalAnswers+=G.total;
  if(G.maxStreak>profile.bestStreak)profile.bestStreak=G.maxStreak;
  if(acc===100)profile.perfectRounds++;
  if(G.diff==='hard'&&acc>profile.hardHighScore)profile.hardHighScore=acc;
  if(!profile.continentsPlayed.includes(G.continent))profile.continentsPlayed.push(G.continent);
  if(!profile.continentBest)profile.continentBest={};
  if(!profile.continentBest[G.continent]||acc>profile.continentBest[G.continent])profile.continentBest[G.continent]=acc;
  profile.leaderboard.push({continent:G.continent,diff:G.diff,score:G.score,acc,date:new Date().toLocaleDateString()});
  profile.leaderboard.sort((a,b)=>b.score-a.score);profile.leaderboard=profile.leaderboard.slice(0,15);
  const newAchs=checkAchievements();saveProfile();

  document.getElementById('res-score').textContent=G.score;
  document.getElementById('res-acc').textContent=acc+'%';
  document.getElementById('res-streak').textContent=G.maxStreak;
  document.getElementById('res-xp').textContent='+'+xpEarned+' XP';
  const dm={easy:'badge-easy',medium:'badge-medium',hard:'badge-hard'};
  document.getElementById('res-sub').innerHTML=`${G.continent} · <span class="badge ${dm[G.diff]}">${G.diff}</span>`;

  const b=document.getElementById('result-award-banner');
  if(stars===3){b.className='award-banner gold';b.innerHTML=`<div style="font-size:36px">🏆</div><div style="font-size:18px;font-weight:500;color:#633806;margin-top:4px">Gold — Perfect!</div><div style="font-size:12px;color:#854F0B">${acc}% · ${G.maxStreak} streak</div>`;}
  else if(stars===2){b.className='award-banner silver';b.innerHTML=`<div style="font-size:36px">🥈</div><div style="font-size:18px;font-weight:500;color:#444;margin-top:4px">Silver — Great job!</div><div style="font-size:12px;color:#666">${acc}% accuracy</div>`;}
  else if(stars===1){b.className='award-banner bronze';b.innerHTML=`<div style="font-size:36px">🥉</div><div style="font-size:18px;font-weight:500;color:#712B13;margin-top:4px">Bronze — Keep going!</div><div style="font-size:12px;color:#993C1D">${acc}% accuracy</div>`;}
  else{b.className='award-banner none';b.innerHTML=`<div style="font-size:28px">📚</div><div style="font-size:16px;font-weight:500;color:#444;margin-top:4px">Keep practising!</div>`;}

  document.getElementById('result-stars').innerHTML=[1,2,3].map(i=>`<span class="star" id="rstar${i}">⭐</span>`).join('');
  [1,2,3].forEach(i=>{if(i<=stars)setTimeout(()=>{const s=document.getElementById('rstar'+i);if(s)s.classList.add('earned');},i*300);});

  document.getElementById('new-achievements').innerHTML=newAchs.length?`
    <div style="background:#FAEEDA;border-radius:10px;padding:10px 12px;margin-bottom:8px">
      <div style="font-size:12px;font-weight:500;color:#633806;margin-bottom:6px">🏆 New achievements!</div>
      ${newAchs.map(a=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#854F0B;margin-bottom:4px"><span style="font-size:18px">${a.icon}</span><b>${a.name}</b> — ${a.desc}</div>`).join('')}
    </div>`:'';

  document.getElementById('res-breakdown').innerHTML=G.queue.map(q=>
    `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid rgba(0,0,0,0.06);font-size:13px">
      <span style="font-size:18px">${q.flag}</span><span style="flex:1">${q.name}</span><span style="font-size:12px;color:#888">${q.capital}</span>
    </div>`).join('');

  showScreen('s-result');
  if(stars===3)setTimeout(confetti,400);
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function confetti(){
  const colors=['#EF9F27','#D4537E','#378ADD','#1D9E75','#7F77DD','#D85A30'];
  const app=document.getElementById('app');
  for(let i=0;i<40;i++){
    const el=document.createElement('div');el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}%;top:-10px;background:${colors[i%colors.length]};transform:rotate(${Math.random()*360}deg)`;
    app.appendChild(el);
    el.animate([{transform:`translateY(0) rotate(0)`,opacity:1},{transform:`translateY(${250+Math.random()*250}px) rotate(720deg)`,opacity:0}],
      {duration:1200+Math.random()*800,easing:'ease-in'}).onfinish=()=>el.remove();
  }
}

updateHomeUI();
</script>
</body>
</html>
