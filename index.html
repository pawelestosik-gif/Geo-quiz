<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Geography Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EDE8;--card:#FFFFFF;--border:rgba(0,0,0,0.1);
  --text:#1A1A2E;--sub:#666;--accent:#2563EB;--accent2:#16A34A;
  --danger:#DC2626;--warn:#D97706;--gold:#F59E0B;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 40px}
#app{width:100%;max-width:460px;position:relative}
.screen{display:none}.screen.active{display:block}

/* HOME */
.home-header{text-align:center;padding:20px 0 16px}
.home-title{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.home-title span{color:var(--accent)}
.home-sub{font-size:13px;color:var(--sub);margin-top:3px}
.stats-row{display:flex;gap:8px;margin-bottom:14px}
.stat-card{flex:1;background:var(--card);border-radius:12px;border:1px solid var(--border);padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.xp-bar-wrap{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px;margin-bottom:14px}
.xp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xp-level{font-size:13px;font-weight:700;color:var(--text)}
.xp-pts{font-size:12px;color:var(--sub)}
.xp-track{height:8px;background:rgba(0,0,0,0.08);border-radius:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),#7C3AED);border-radius:4px;transition:width .5s}

/* CONTINENT GRID */
.section-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.continent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cont-card{background:var(--card);border-radius:12px;border:2px solid var(--border);padding:14px 12px;cursor:pointer;transition:all .15s;text-align:left}
.cont-card:hover,.cont-card.sel{border-color:var(--accent);background:#EFF6FF}
.cont-card .cont-icon{font-size:26px;margin-bottom:4px}
.cont-card .cont-name{font-size:13px;font-weight:700;color:var(--text)}
.cont-card .cont-count{font-size:11px;color:var(--sub)}

/* DIFFICULTY */
.diff-row{display:flex;gap:6px;margin-bottom:14px}
.diff-btn{flex:1;padding:9px 4px;font-size:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;text-align:center;font-family:inherit;font-weight:600;transition:all .12s}
.diff-btn.active{background:#EFF6FF;color:var(--accent);border-color:var(--accent)}

.btn-primary{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .12s;letter-spacing:.2px}
.btn-primary:hover{background:#1D4ED8}
.btn-primary:disabled{background:#93C5FD;cursor:not-allowed}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}

/* GAME */
.game-topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.game-back{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--sub)}
.game-progress{flex:1;height:6px;background:rgba(0,0,0,0.08);border-radius:3px;overflow:hidden}
.game-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.game-score{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap}
.streak-badge{background:#FEF3C7;border:1px solid #FCD34D;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700;color:#92400E;display:none}
.streak-badge.show{display:inline-block}

.q-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:16px;margin-bottom:10px}
.q-step-dots{display:flex;gap:5px;margin-bottom:10px}
.q-step-dot{width:22px;height:5px;background:rgba(0,0,0,0.1);border-radius:3px;transition:background .2s}
.q-step-dot.done{background:var(--accent2)}
.q-step-dot.active{background:var(--accent)}
.q-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.q-flag-big{font-size:56px;text-align:center;padding:10px 0;line-height:1}
.q-question{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;line-height:1.4}

.ans-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:7px;transition:all .12s;font-family:inherit;text-align:left}
.ans-btn:hover:not(:disabled){background:#F8FAFF;border-color:var(--accent)}
.ans-btn.correct{background:#DCFCE7;border-color:var(--accent2);color:#14532D}
.ans-btn.wrong{background:#FEE2E2;border-color:var(--danger);color:#7F1D1D}
.ans-btn.reveal{background:#DCFCE7;border-color:var(--accent2);color:#14532D;opacity:.75}
.ans-btn:disabled{cursor:default}
.ans-icon{font-size:16px;min-width:20px;text-align:center}

/* MAP */
.map-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:12px;margin-bottom:10px}
.map-hint{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
#map-svg{width:100%;display:block;border-radius:8px;background:#C8E6F5;cursor:pointer}
#map-svg .country{stroke:#fff;stroke-width:0.5;fill:#A8C4D8;transition:fill .15s;cursor:pointer}
#map-svg .country.quiz-country{fill:#60A5FA;stroke:#2563EB;stroke-width:1}
#map-svg .country.correct{fill:#4ADE80 !important;stroke:#16A34A !important;stroke-width:2}
#map-svg .country.wrong{fill:#F87171 !important;stroke:#DC2626 !important;stroke-width:2}
#map-svg .country.reveal{fill:#4ADE80 !important;stroke:#16A34A !important;stroke-width:2;opacity:.8}
#map-svg .country:hover{opacity:.8}

.map-loading{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}
.map-loading .spinner{width:32px;height:32px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESULT / FEEDBACK */
.feedback-bar{border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;margin-bottom:8px;display:none}
.feedback-bar.correct{display:flex;align-items:center;gap:6px;background:#DCFCE7;color:#14532D}
.feedback-bar.wrong{display:flex;align-items:center;gap:6px;background:#FEE2E2;color:#7F1D1D}
.next-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:none}
.next-btn.show{display:block}

/* RESULTS SCREEN */
.result-hero{text-align:center;padding:20px 0 14px}
.result-stars{font-size:40px;margin-bottom:4px}
.result-title{font-size:22px;font-weight:800;color:var(--text)}
.result-sub{font-size:14px;color:var(--sub);margin-top:3px}
.result-stats{display:flex;gap:8px;margin-bottom:14px}
.result-stat{flex:1;background:var(--card);border-radius:12px;border:1px solid var(--border);padding:10px;text-align:center}
.result-stat-val{font-size:20px;font-weight:800;color:var(--accent)}
.result-stat-lbl{font-size:11px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.breakdown-list{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:4px 12px;margin-bottom:12px}
.bk-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.bk-row:last-child{border-bottom:none}
.bk-flag{font-size:20px}
.bk-name{flex:1;font-weight:600;color:var(--text)}
.bk-score{font-size:12px;color:var(--sub)}

/* LEADERBOARD */
.lb-list{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:4px 12px;margin-bottom:12px}
.lb-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-size:14px;font-weight:800;width:24px;text-align:center;color:var(--sub)}
.lb-rank.gold{color:var(--gold)}
.lb-name{flex:1;font-weight:600;color:var(--text)}
.lb-pts{font-weight:700;color:var(--accent)}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1A2E;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CONFETTI */
.confetti-p{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:998}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ach-card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:10px;opacity:.4}
.ach-card.unlocked{opacity:1;border-color:var(--gold);background:#FFFBEB}
.ach-icon{font-size:22px;margin-bottom:3px}
.ach-name{font-size:11px;font-weight:700;color:var(--text)}
.ach-desc{font-size:10px;color:var(--sub)}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="s-home" class="screen active">
  <div class="home-header">
    <div class="home-title">🌍 Geo<span>Quiz</span></div>
    <div class="home-sub">Test your world geography knowledge</div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="h-played">0</div><div class="stat-lbl">Played</div></div>
    <div class="stat-card"><div class="stat-val" id="h-best">-</div><div class="stat-lbl">Best</div></div>
    <div class="stat-card"><div class="stat-val" id="h-streak">0</div><div class="stat-lbl">Best Streak</div></div>
  </div>
  <div class="xp-bar-wrap">
    <div class="xp-row"><span class="xp-level" id="h-level">Explorer</span><span class="xp-pts" id="h-xp">0 XP</span></div>
    <div class="xp-track"><div class="xp-fill" id="h-xp-fill" style="width:0%"></div></div>
  </div>
  <div class="section-label">Choose Region</div>
  <div class="continent-grid" id="cont-grid"></div>
  <div class="section-label">Difficulty</div>
  <div class="diff-row" id="diff-row">
    <button class="diff-btn active" data-d="easy" onclick="setDiff('easy')">⭐ Easy<br><span style="font-size:10px;font-weight:400">5 countries</span></button>
    <button class="diff-btn" data-d="medium" onclick="setDiff('medium')">⭐⭐ Medium<br><span style="font-size:10px;font-weight:400">8 countries</span></button>
    <button class="diff-btn" data-d="hard" onclick="setDiff('hard')">⭐⭐⭐ Hard<br><span style="font-size:10px;font-weight:400">12 countries</span></button>
  </div>
  <button class="btn-primary" id="start-btn" onclick="startGame()" disabled>Choose a region first</button>
  <button class="btn-secondary" onclick="showScreen('s-lb')">🏆 Leaderboard</button>
  <button class="btn-secondary" onclick="showScreen('s-ach')">🎖 Achievements</button>
</div>

<!-- GAME -->
<div id="s-game" class="screen">
  <div class="game-topbar">
    <button class="game-back" onclick="confirmQuit()">✕</button>
    <div class="game-progress"><div class="game-progress-fill" id="g-prog"></div></div>
    <div class="game-score">⭐ <span id="g-score">0</span></div>
    <div class="streak-badge" id="g-streak"></div>
  </div>
  <div class="q-card" id="q-card">
    <div class="q-step-dots" id="step-dots"></div>
    <div class="q-label" id="q-label"></div>
    <div id="q-content"></div>
  </div>
  <!-- Map step -->
  <div class="map-card" id="map-card" style="display:none">
    <div id="map-container"></div>
    <div class="map-hint" id="map-hint">Tap the correct country on the map</div>
  </div>
  <div class="feedback-bar" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextStep()">Continue →</button>
</div>

<!-- RESULTS -->
<div id="s-result" class="screen">
  <div class="result-hero">
    <div class="result-stars" id="res-stars"></div>
    <div class="result-title" id="res-title"></div>
    <div class="result-sub" id="res-sub"></div>
  </div>
  <div class="result-stats">
    <div class="result-stat"><div class="result-stat-val" id="res-score">0</div><div class="result-stat-lbl">Score</div></div>
    <div class="result-stat"><div class="result-stat-val" id="res-acc">0%</div><div class="result-stat-lbl">Accuracy</div></div>
    <div class="result-stat"><div class="result-stat-val" id="res-xp">+0</div><div class="result-stat-lbl">XP Earned</div></div>
  </div>
  <div id="res-breakdown" class="breakdown-list"></div>
  <button class="btn-primary" onclick="showScreen('s-home');updateHomeUI()">Play Again</button>
  <button class="btn-secondary" onclick="showScreen('s-lb')">🏆 Leaderboard</button>
</div>

<!-- LEADERBOARD -->
<div id="s-lb" class="screen">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-top:8px">
    <button class="game-back" onclick="showScreen('s-home')">← Back</button>
    <h2 style="font-size:18px;font-weight:800;color:var(--text)">🏆 Leaderboard</h2>
  </div>
  <div id="lb-list" class="lb-list"></div>
</div>

<!-- ACHIEVEMENTS -->
<div id="s-ach" class="screen">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-top:8px">
    <button class="game-back" onclick="showScreen('s-home')">← Back</button>
    <h2 style="font-size:18px;font-weight:800;color:var(--text)">🎖 Achievements</h2>
  </div>
  <div class="ach-grid" id="ach-grid"></div>
</div>

</div>
<div id="toast"></div>

function showScreen(id){

  window.scrollTo(0,0);
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function getLevelInfo(xp){
  let lv=0;
  for(let i=0;i<LEVELS.length;i++) if(xp>=LEVELS[i].min) lv=i;
  const next = lv<LEVELS.length-1 ? LEVELS[lv+1] : null;
  const pct = next ? Math.min(100,((xp-LEVELS[lv].min)/(next.min-LEVELS[lv].min))*100) : 100;
  return {name:LEVELS[lv].name, pct, xp, next};
}

function startGame(){
  if(!G.continent) return;
  const pool = [...(COUNTRIES[G.continent]||[])].sort(()=>Math.random()-.5);
  const n = DIFF[G.diff].count;
  G.queue = pool.slice(0,n);
  G.idx=0; G.step=0; G.score=0; G.streak=0; G.maxStreak=0;
  G.correctTotal=0; G.totalSteps=0;
  showScreen('s-game');
  showQuestion();
  loadTopoData();
}

function showQuestion(){
  const q = G.queue[G.idx];
  if(!q) return finishGame();
  G.step = 0;
  const total = G.queue.length;
  document.getElementById('g-prog').style.width = (G.idx/total*100)+'%';
  document.getElementById('g-score').textContent = G.score;
  renderStepDots(3);
  showStep(0);
}

function renderStepDots(count){
  const dots = document.getElementById('step-dots');
  dots.innerHTML = Array.from({length:count},(_,i)=>`<div class="q-step-dot${i<G.step?' done':i===G.step?' active':''}"></div>`).join('');
}

function showStep(step){
  G.step = step;
  renderStepDots(3);
  const q = G.queue[G.idx];
  const card = document.getElementById('q-card');
  const label = document.getElementById('q-label');
  const content = document.getElementById('q-content');
  const mapCard = document.getElementById('map-card');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('next-btn');
  feedback.className='feedback-bar'; feedback.textContent='';
  nextBtn.classList.remove('show');
  card.style.display='block';
  mapCard.style.display='none';

  if(step===0){
    label.textContent = 'STEP 1 OF 3 — Name the Country';
    content.innerHTML = `
      <div class="q-flag-big">${q.flag}</div>
      <div class="q-question">Which country does this flag belong to?</div>
      ${makeOptions(q,'name')}`;
  } else if(step===1){
    label.textContent = 'STEP 2 OF 3 — Capital City';
    content.innerHTML = `
      <div class="q-question">What is the capital of ${q.name}? ${q.flag}</div>
      ${makeOptions(q,'capital')}`;
  } else if(step===2){
    label.textContent = 'STEP 3 OF 3 — Find on Map';
    card.style.display='none';
    mapCard.style.display='block';
    renderMap(q);
  }
}

function makeOptions(q, field){
  const pool = COUNTRIES[G.continent]||COUNTRIES.europe;
  let opts = [q];
  const others = pool.filter(c=>c.id!==q.id).sort(()=>Math.random()-.5);
  opts = opts.concat(others.slice(0,3)).sort(()=>Math.random()-.5);
  return opts.map(o=>`
    <button class="ans-btn" onclick="checkAnswer(this,'${o.id}','${q.id}','${field}')">
      <span class="ans-icon">${field==='capital'?'🏛':o.flag}</span>
      ${field==='capital'?o.capital:o.name}
    </button>`).join('');
}

function checkAnswer(btn, chosen, correct, field){
  if(btn.disabled) return;
  document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);
  G.totalSteps++;
  const isCorrect = chosen === correct;
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('next-btn');
  const q = G.queue[G.idx];

  if(isCorrect){
    btn.classList.add('correct');
    btn.innerHTML = '✅ ' + btn.innerHTML;
    G.score += G.streak>=5?200:G.streak>=3?150:100;
    G.streak++;
    G.maxStreak = Math.max(G.maxStreak, G.streak);
    G.correctTotal++;
    feedback.className='feedback-bar correct';
    feedback.innerHTML = `✅ Correct! ${G.streak>=3?`🔥 ${G.streak}-streak!`:''}`;
  } else {
    btn.classList.add('wrong');
    G.streak=0;
    // reveal correct
    document.querySelectorAll('.ans-btn').forEach(b=>{
      const id = b.getAttribute('onclick')?.match(/'([^']+)','[^']+'/)?.[1];
      if(id===correct) b.classList.add('reveal');
    });
    const correctVal = field==='name'?q.name:q.capital;
    feedback.className='feedback-bar wrong';
    feedback.innerHTML = `❌ The answer was <b>${correctVal}</b>`;
  }

  // Update streak badge
  const badge = document.getElementById('g-streak');
  if(G.streak>=3){badge.textContent=`🔥 ${G.streak}`;badge.classList.add('show')}
  else badge.classList.remove('show');
  document.getElementById('g-score').textContent = G.score;

  nextBtn.textContent = G.step<2 ? 'Continue →' : 'Next Country →';
  nextBtn.classList.add('show');
}

function nextStep(){
  if(G.step<2){
    showStep(G.step+1);
  } else {
    G.idx++;
    showQuestion();
  }
}

// Continent bounding boxes [x0,y0,width,height] in natural earth projection space for clipping
// We use a world topojson and filter + project per continent
const CONT_PROJ = {
  europe:   {scale:800, center:[15,54]},
  asia:     {scale:280, center:[100,40]},
  africa:   {scale:340, center:[20,5]},
  americas: {scale:220, center:[-75,10]},
  oceania:  {scale:430, center:[155,-25]},
  world:    {scale:145, center:[0,20]},
};

let topoCache = null;

function loadTopoData(){
  if(topoCache){G.topoData=topoCache;G.topoReady=true;return;}
  // Try fetching Natural Earth TopoJSON
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r=>r.json())
    .then(data=>{topoCache=data;G.topoData=data;G.topoReady=true;
      // If map is showing, re-render
      if(document.getElementById('map-card').style.display!=='none'){
        renderMap(G.queue[G.idx]);
      }
    })
    .catch(()=>{G.topoReady=false;G.topoData=null;});
}

function renderMap(q){
  const container = document.getElementById('map-container');
  const hint = document.getElementById('map-hint');
  const nextBtn = document.getElementById('next-btn');

  container.innerHTML = `<div class="map-loading"><div class="spinner"></div>Loading map…</div>`;
  hint.textContent = 'Tap the correct country on the map';

  // Get quiz country ISO numbers for highlighting
  const quizIsos = G.queue.map(c=>ISO_NUM[c.iso]).filter(Boolean);
  const targetIso = ISO_NUM[q.iso];

  // Wait a tick for topo data
  const tryRender = (attempts) => {
    if(G.topoData){
      doRenderMap(q, quizIsos, targetIso, container, hint, nextBtn);
    } else if(attempts > 0){
      setTimeout(()=>tryRender(attempts-1), 300);
    } else {
      renderFallbackMap(q, container, hint, nextBtn);
    }
  };
  tryRender(15);
}

function doRenderMap(q, quizIsos, targetIso, container, hint, nextBtn){
  const W=440, H=320;
  const cont = G.continent;
  const proj = CONT_PROJ[cont]||CONT_PROJ.world;

  // Build SVG path using simple Mercator-ish projection
  // We use the TopoJSON feature data
  const topo = G.topoData;
  let countries;
  try {
    // topojson-client via CDN
    countries = window.topojson.feature(topo, topo.objects.countries).features;
  } catch(e){
    renderFallbackMap(q, container, hint, nextBtn);
    return;
  }

  // Filter to continent if not world
  const contFilter = getContFilter(cont);
  const visible = countries.filter(f => {
    const id = +f.id;
    if(cont==='world') return true;
    return contFilter.has(id);
  });

  // Build d3 path
  let projection;
  try {
    projection = d3.geoNaturalEarth1 ? d3.geoNaturalEarth1() : d3.geoMercator();
  } catch(e){
    renderFallbackMap(q, container, hint, nextBtn);
    return;
  }
  
  projection.scale(proj.scale).center(proj.center).translate([W/2, H/2]);
  const path = d3.geoPath().projection(projection);

  let svgPaths = visible.map(f=>{
    const id = +f.id;
    const isQuiz = quizIsos.includes(id);
    const isTarget = id===targetIso;
    let cls = 'country';
    if(isQuiz) cls += ' quiz-country';
    const d = path(f);
    if(!d) return '';
    return `<path class="${cls}" data-id="${id}" d="${d}"/>`;
  }).join('');

  container.innerHTML = `<svg id="map-svg" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="#C8E6F5" rx="8"/>
    ${svgPaths}
  </svg>`;

  // Add click handlers
  container.querySelectorAll('.country').forEach(el=>{
    el.addEventListener('click', ()=>{
      const clickedId = +el.dataset.id;
      handleMapClick(clickedId, targetIso, q, hint, nextBtn);
    });
  });
}

function getContFilter(cont){
  const s = new Set();
  if(cont==='world') return s;
  (COUNTRIES[cont]||[]).forEach(c=>{
    const n = ISO_NUM[c.iso];
    if(n) s.add(n);
  });
  // Also add non-quiz neighbours for context — use large predefined sets
  const NEIGHBOURS = {
    europe: [250,276,380,724,616,528,56,752,578,620,756,40,300,203,348,642,246,208,826,372,191,703,100,688,804,705,840,124,642,498,112,440,233,428,440,528,56,40,705,891,807,8,70,20,492,470,352,208,826],
    asia: [156,392,356,410,764,704,608,360,458,586,50,364,368,682,792,398,860,784,376,158,704,116,418,104,404,694,144,634,512,414,400,51,31,268,762,795,4,50,418,608,116,764],
    africa: [566,231,818,710,404,288,834,504,12,788,729,120,686,384,24,508,800,450,894,716,706,174,690,646,516,624,426,748,144,266,654,148,562,466,478,478,686,585,4],
    americas: [840,124,484,76,32,170,152,604,862,218,68,192,332,858,600,320,340,188,591,214,388,052,028,214,630,660,010],
    oceania: [36,554,598,242,90,548,882,296,583,776,520,184,570,574],
  };
  (NEIGHBOURS[cont]||[]).forEach(id=>s.add(id));
  return s;
}

function handleMapClick(clickedId, targetId, q, hint, nextBtn){
  const svg = document.getElementById('map-svg');
  if(!svg) return;
  // Already answered?
  if(svg.dataset.answered) return;
  svg.dataset.answered='1';

  // Mark all unclickable
  svg.querySelectorAll('.country').forEach(p=>p.style.pointerEvents='none');

  const isCorrect = clickedId===targetId;
  G.totalSteps++;

  if(isCorrect){
    svg.querySelector(`[data-id="${clickedId}"]`)?.classList.add('correct');
    G.score += G.streak>=5?200:G.streak>=3?150:100;
    G.streak++;
    G.maxStreak=Math.max(G.maxStreak,G.streak);
    G.correctTotal++;
    S.map_finds = (S.map_finds||0)+1;
    hint.innerHTML='✅ Correct! Well done!';
    hint.style.color='#16A34A';
  } else {
    svg.querySelector(`[data-id="${clickedId}"]`)?.classList.add('wrong');
    svg.querySelector(`[data-id="${targetId}"]`)?.classList.add('reveal');
    G.streak=0;
    hint.innerHTML=`❌ That's not right — the correct country is highlighted in green`;
    hint.style.color='#DC2626';
  }

  const badge = document.getElementById('g-streak');
  if(G.streak>=3){badge.textContent=`🔥 ${G.streak}`;badge.classList.add('show')}
  else badge.classList.remove('show');
  document.getElementById('g-score').textContent = G.score;

  nextBtn.textContent='Next Country →';
  nextBtn.classList.add('show');
}

// Fallback map when CDN fails — text-based option list
function renderFallbackMap(q, container, hint, nextBtn){
  const pool = G.queue.filter(c=>c.id!==q.id).sort(()=>Math.random()-.5).slice(0,3);
  const opts = [q,...pool].sort(()=>Math.random()-.5);
  container.innerHTML = `
    <div style="padding:8px 0">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px">Find ${q.name} ${q.flag}</div>
      ${opts.map(o=>`<button class="ans-btn" onclick="checkFallbackMap(this,'${o.id}','${q.id}')">
        <span class="ans-icon">${o.flag}</span>${o.name}</button>`).join('')}
    </div>`;
  hint.textContent='';
}
function checkFallbackMap(btn, chosen, correct){
  if(btn.disabled) return;
  document.querySelectorAll('#map-container .ans-btn').forEach(b=>b.disabled=true);
  const q=G.queue[G.idx];
  G.totalSteps++;
  const isCorrect = chosen===correct;
  const hint = document.getElementById('map-hint');
  const nextBtn = document.getElementById('next-btn');
  if(isCorrect){
    btn.classList.add('correct');
    G.score+=100; G.streak++; G.maxStreak=Math.max(G.maxStreak,G.streak); G.correctTotal++;
    hint.innerHTML='✅ Correct!'; hint.style.color='#16A34A';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('#map-container .ans-btn').forEach(b=>{
      if(b.getAttribute('onclick')?.includes(`'${correct}'`)) b.classList.add('reveal');
    });
    G.streak=0; hint.innerHTML='❌ Wrong!'; hint.style.color='#DC2626';
  }
  const badge=document.getElementById('g-streak');
  if(G.streak>=3){badge.textContent=`🔥 ${G.streak}`;badge.classList.add('show')}
  else badge.classList.remove('show');
  document.getElementById('g-score').textContent=G.score;
  nextBtn.textContent='Next Country →'; nextBtn.classList.add('show');
}

function finishGame(){
  const total = G.queue.length * 3;
  const pct = G.totalSteps>0 ? Math.round((G.correctTotal/G.totalSteps)*100) : 0;
  const stars = pct>=90?3:pct>=60?2:1;
  const xpEarned = Math.round(DIFF[G.diff].xp * (pct/100) * (G.diff==='hard'?2:1));

  S.xp += xpEarned;
  S.played++;
  if(G.score>S.bestScore) S.bestScore=G.score;
  if(G.maxStreak>S.bestStreak) S.bestStreak=G.maxStreak;
  if(!S.played_conts) S.played_conts=[];
  if(!S.played_conts.includes(G.continent)) S.played_conts.push(G.continent);

  // Leaderboard
  if(!S.lb) S.lb=[];
  S.lb.push({score:G.score, cont:G.continent, diff:G.diff, date:new Date().toLocaleDateString()});
  S.lb.sort((a,b)=>b.score-a.score);
  S.lb=S.lb.slice(0,15);

  checkAchievements(pct);
  saveState();

  // Results screen
  document.getElementById('res-stars').textContent='⭐'.repeat(stars);
  const titles=['Keep Practicing!','Good Job!','Excellent!','Geography Master!'];
  document.getElementById('res-title').textContent=titles[stars];
  document.getElementById('res-sub').textContent=`You scored ${G.score} points with ${pct}% accuracy`;
  document.getElementById('res-score').textContent=G.score;
  document.getElementById('res-acc').textContent=pct+'%';
  document.getElementById('res-xp').textContent='+'+xpEarned;

  document.getElementById('res-breakdown').innerHTML=G.queue.map(q=>
    `<div class="bk-row"><span class="bk-flag">${q.flag}</span><span class="bk-name">${q.name}</span><span class="bk-score">${q.capital}</span></div>`
  ).join('');

  showScreen('s-result');
  if(stars===3) setTimeout(launchConfetti,400);
}

// ═══════════════════════════════════════════
//  LEADERBOARD
// ═══════════════════════════════════════════
function renderLeaderboard(){
  const lb = S.lb||[];
  const el = document.getElementById('lb-list');
  if(!lb.length){el.innerHTML='<div style="padding:14px;text-align:center;color:var(--sub);font-size:13px">No games yet — play first!</div>';return;}
  el.innerHTML=lb.map((e,i)=>`
    <div class="lb-row">
      <div class="lb-rank${i<3?' gold':''}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="lb-name">${e.cont} · ${e.diff}</div>
      <div style="font-size:11px;color:var(--sub)">${e.date}</div>
      <div class="lb-pts">${e.score}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════
//  ACHIEVEMENTS
// ═══════════════════════════════════════════
function checkAchievements(pct){
  if(!S.ach) S.ach=[];
  const unlock=(id)=>{if(!S.ach.includes(id)){S.ach.push(id);showToast('🎖 Achievement: '+ACHIEVEMENTS.find(a=>a.id===id)?.name);}};
  if(S.played>=1) unlock('first');
  if(G.maxStreak>=5) unlock('streak5');
  if(G.maxStreak>=10) unlock('streak10');
  if(pct===100) unlock('perfect');
  if(G.diff==='hard') unlock('hard_win');
  if(G.continent==='europe') unlock('europe_exp');
  if(G.continent==='asia') unlock('asia_exp');
  if(G.continent==='africa') unlock('africa_exp');
  if((S.played_conts||[]).length>=5) unlock('globe_trotter');
  if(G.diff==='hard'&&pct>=80) unlock('diamond');
  if(S.played>=10) unlock('10games');
  if((S.map_finds||0)>=30) unlock('map_master');
}
function renderAchievements(){
  const el=document.getElementById('ach-grid');
  el.innerHTML=ACHIEVEMENTS.map(a=>`
    <div class="ach-card${(S.ach||[]).includes(a.id)?' unlocked':''}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════
function launchConfetti(){
  const colors=['#2563EB','#16A34A','#D97706','#DC2626','#7C3AED','#0891B2'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div');
    el.className='confetti-p';
    el.style.cssText=`left:${Math.random()*100}vw;top:-12px;background:${colors[i%colors.length]};transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    el.animate([{transform:`translateY(0) rotate(0) scale(1)`,opacity:1},{transform:`translateY(${300+Math.random()*300}px) rotate(${720+Math.random()*360}deg) scale(0.5)`,opacity:0}],
      {duration:1400+Math.random()*800,easing:'ease-in'}).onfinish=()=>el.remove();
  }
}
